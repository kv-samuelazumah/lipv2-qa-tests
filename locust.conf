# Run from the repository root with: .venv/bin/locust
locustfile = performance/locustfile.py
headless = true
users = 20
spawn-rate = 2
run-time = 60s
only-summary = true

# Scenario indexes match the test, setup, and fixture files.
# Uncomment only one scenario at a time.

