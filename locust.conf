# Run from the repository root with: .venv/bin/locust
locustfile = performance/locustfile.py
headless = true
users = 10
spawn-rate = 2
run-time = 60s
only-summary = true

# Select a test from performance/tests/test_<scenario>.py.
# Uncomment only one scenario at a time.

# scenario = all
# scenario = configured_tax_exclusion
# scenario = stable_lookup_shared_across_organisations
scenario = unstable_lookup_reused_by_validating_organisation

# Shared settings: interval and timeout are seconds; timing limits are milliseconds.
interval = 1
timeout = 30
avg-ms = 500
p95-ms = 1000
p99-ms = 1500
# Minimum verified completed workflows per second, including queue drain.
min-rps = 1
min-samples = 20
